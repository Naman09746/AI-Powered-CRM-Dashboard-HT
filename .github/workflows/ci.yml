name: CRM Dashboard CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        
    - name: Run migrations (SQLite)
      env:
        DATABASE_URL: "sqlite:///:memory:"
        SECRET_KEY: "ci-secret-key-for-testing"
      run: |
        cd backend
        alembic upgrade head

    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check backend/app --line-length 100 || true

    - name: Type check with mypy
      run: |
        pip install mypy
        mypy backend/app --ignore-missing-imports --no-error-summary || true

    - name: Run backend tests
      env:
        DATABASE_URL: "sqlite:///:memory:"
        SECRET_KEY: "ci-secret-key-for-testing"
      run: |
        cd backend
        pytest tests -v --tb=short


  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Lint frontend
      run: |
        cd frontend
        npm run lint || true

    - name: Build client production bundles
      run: |
        cd frontend
        npm run build
