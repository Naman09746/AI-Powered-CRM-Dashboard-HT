services:
  # FastAPI Backend Service
  - type: web
    name: crm-backend
    env: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crm-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: '["https://crm-frontend.onrender.com", "http://localhost:5173"]'
      - key: GEMINI_API_KEY
        sync: false

  # React / Vite Frontend Service
  - type: web
    name: crm-frontend
    env: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://crm-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: crm-backend
          property: host

databases:
  # Managed PostgreSQL Database
  - name: crm-postgres
    region: oregon
    databaseName: crm_db
    user: crm_user
    plan: free
